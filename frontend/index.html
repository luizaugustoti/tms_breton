<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS Breton — Login</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login">
    <div class="login__container">
        <div class="login__brand">
            <h1 class="login__title">BRETON</h1>
            <span class="login__subtitle">TMS Operations</span>
        </div>
        
        <form class="login__form" id="loginForm">
            <div id="loginAlert" style="display:none; padding:12px; border-radius:4px; margin-bottom:16px; font-size:0.85rem; font-weight:600;"></div>
            
            <div class="form-group">
                <label for="username" class="form-label">Usuário ou E-mail</label>
                <input type="text" id="username" class="form-input" placeholder="Digite seu acesso" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <div class="login__actions">
                <a href="#" class="login__forgot" onclick="alert('Por favor, entre em contato com o administrador do sistema.')">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="btn btn--primary login__button" id="btnLogin">Entrar no Sistema</button>
        </form>
    </div>

    <script src="./js/config.js"></script>
    <script type="module" src="./js/modules/login.js?v=16"></script>
</body>
</html>
